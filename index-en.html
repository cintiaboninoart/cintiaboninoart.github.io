content:"";

0deg,

rgba(255,255,255,.05) 1px,

transparent 2px

}

function createGrid(selectedCategory="all"){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let visibleIndex=0;

  projects.forEach((p,i)=>{
    if(selectedCategory!=="all" && p.category!==selectedCategory) return;
    const previewIndex=visibleIndex++;

    const item=document.createElement("div");
    item.className="item";
    item.dataset.category=p.category;
    if (p.pageUrl) {
      item.onclick=()=>{ window.location.href=p.pageUrl; };
      item.setAttribute("role","link");
      item.setAttribute("tabindex","0");
      item.setAttribute("aria-label", `View project: ${p.title}`);
      item.addEventListener("keydown", event=>{
        if(event.key==="Enter" || event.key===" "){event.preventDefault();window.location.href=p.pageUrl;}
      });
    } else {
      item.onclick=()=>openProject(i);
    }

    const mediaWrap=document.createElement("div");
    mediaWrap.className="item-media";

    let media;

if(p.cover.toLowerCase().endsWith(".mp4")){
  media=document.createElement("video");
  mediaWrap.classList.add("item-video-media");

  media.autoplay=true;
  media.muted=true;
  media.loop=true;
  media.playsInline=true;
  media.preload = previewIndex < 2 ? "metadata" : "none";
  if(previewIndex < 2){
    media.src=p.cover;
  }else{
    media.dataset.src=p.cover;
    media.classList.add("lazy-video");
  }
}

 
else{
  media=document.createElement("img");
  // Set intrinsic dimensions as soon as metadata is available to help Lighthouse avoid layout shifts.
  media.addEventListener("load", () => {
    if (media.naturalWidth && media.naturalHeight) {
      media.width = media.naturalWidth;
      media.height = media.naturalHeight;
    }
  }, { once: true });
  media.src=p.cover;
  media.loading = previewIndex === 0 ? "eager" : "lazy";
  media.decoding="async";

  // Reserve layout space after intrinsic dimensions become available and prioritize only the first image.
  if (previewIndex === 0) {
    media.fetchPriority = "high";
  } else {
    media.fetchPriority = "auto";
  }

  const categoryLabels = {editorial:"editorial illustration",brands:"cultural campaigns",music:"animated music video",author:"artist-led 2D animation"};
  media.alt = `${p.title} — ${categoryLabels[p.category] || "visual project"}: ${p.description} — Cintia Bonino`;
}



    mediaWrap.appendChild(media);

    const overlay=document.createElement("div");
    overlay.className="item-overlay";
    overlay.innerHTML=`
    <div class="window-bar">
      <div class="window-dots">
        <span></span><span></span><span></span>
      </div>
      ${p.title}.exe
    </div>
    <span>${p.title}</span>
    `;

    mediaWrap.appendChild(overlay);
    item.appendChild(mediaWrap);

    
const caption=document.createElement("div");
caption.className="project-caption";
caption.innerHTML=`
  <h3>${p.title}</h3>
  <p>${p.description}</p>
`;
item.appendChild(caption);


grid.appendChild(item);
  });

  // Defer loading videos until they approach the viewport.
  const lazyVideos = grid.querySelectorAll("video.lazy-video[data-src]");
  if ("IntersectionObserver" in window) {
    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const video = entry.target;
        video.src = video.dataset.src;
        delete video.dataset.src;
        video.load();
        const playAttempt = video.play();
        if (playAttempt && typeof playAttempt.catch === "function") playAttempt.catch(() => {});
        video.classList.remove("lazy-video");
        videoObserver.unobserve(video);
      });
    }, { rootMargin: "300px 0px" });
    lazyVideos.forEach(video => videoObserver.observe(video));
  } else {
    lazyVideos.forEach(video => {
      video.src = video.dataset.src;
      delete video.dataset.src;
      video.load();
    });
  }
}

function openProject(i){
  const modal=document.getElementById("modal");
  const content=document.getElementById("modal-content");
  const p=projects[i];


content.innerHTML=`
<div class="modal-header">${p.title}.viewer</div>
<div class="modal-body">
  <h2>${p.title}</h2>
  <p>${p.description}</p>
  ${p.instagram ? `
    <p>
      <a class="instagram-link"
         href="${p.instagram}"
         target="_blank"
         rel="noopener noreferrer">
        Watch the version with music on Instagram ↗
      </a>
    </p>
  ` : ""}
  ${p.pageUrl ? `<p><a class="project-page-link" href="${p.pageUrl}">View full project ↗</a></p>` : ""}
</div>
`;


  const body=content.querySelector(".modal-body");

  (p.images || []).forEach((src, index)=>{
    if(typeof src==="object"){
      const iframe = document.createElement("iframe");

iframe.src = `https://player.vimeo.com/video/${src.id}`;
iframe.style.width = "100%";
iframe.style.aspectRatio = "16 / 9";
iframe.style.height = "auto";
iframe.style.display = "block";
iframe.style.border = "0";
iframe.allow = "autoplay; fullscreen; picture-in-picture";
iframe.allowFullscreen = true;

body.appendChild(iframe);

    }else if(p.cover && p.cover.endsWith(".mp4")){

      const video=document.createElement("video");
      video.src=src;
      video.controls=true;
      video.preload="metadata";
      video.playsInline=true;
      video.style.width="100%";
      video.style.height="auto";
      body.appendChild(video);

    }else{
      const img=document.createElement("img");
img.addEventListener("load", () => {
  if (img.naturalWidth && img.naturalHeight) {
    img.width = img.naturalWidth;
    img.height = img.naturalHeight;
  }
}, { once: true });
img.src=src;
const categoryLabels = {editorial:"editorial illustration",brands:"cultural campaigns",music:"animated music video",author:"artist-led 2D animation"};
img.alt = p.alt || `${p.title} — ${categoryLabels[p.category] || "visual project"}: ${p.description} — Cintia Bonino`;
img.loading = "lazy";
img.decoding = "async";
      body.appendChild(img);

      // 👇 TÍTULO DEBAJO
      if(p.titles && p.titles[index]){
        const caption=document.createElement("p");
        caption.className="image-title";
        caption.textContent=p.titles[index];
        body.appendChild(caption);
      }
    }
  });

  modal.style.display="block";
}

function setupProjectFilters(){
  const buttons=document.querySelectorAll(".project-filters button");
  buttons.forEach(button=>{
    button.addEventListener("click",()=>{
      const selected=button.dataset.filter;
      buttons.forEach(candidate=>candidate.setAttribute("aria-pressed",String(candidate===button)));
      createGrid(selected);
    });
  });
}

function closeModal(){
  if (new URLSearchParams(window.location.search).has("project")) {
    window.location.href = "/editorial-illustration.html";
    return;
  }
  document.getElementById("modal").style.display="none";
}

createGrid("all");
setupProjectFilters();


</script>

<script>
(function(){
  function alignSubtitle(){
    const header = document.querySelector('header');
    if(!header) return;
    const name = header.querySelector('.name-title, .title, h1');
    const subtitle = header.querySelector('p.subtitle');
    if(!name || !subtitle) return;
    const clone = name.cloneNode(true);
    const cs = getComputedStyle(name);
    clone.style.cssText += ';position:fixed;left:-10000px;top:0;visibility:hidden;display:inline-block;width:max-content;max-width:none;white-space:nowrap;margin:0;transform:none;';
    ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','textTransform','lineHeight'].forEach(function(prop){clone.style[prop]=cs[prop];});
    document.body.appendChild(clone);
    const width = clone.getBoundingClientRect().width;
    clone.remove();
    subtitle.style.width = Math.min(width, window.innerWidth - 32) + 'px';
  }
  window.addEventListener('load', alignSubtitle);
  window.addEventListener('resize', alignSubtitle);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(alignSubtitle);
})();
</script>
