<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cintia Bonino — Editorial Illustrator in Barcelona</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cintia Bonino is an editorial illustrator and animator based in Barcelona. Illustration for press, cultural posters, visual campaigns and 2D animation.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<style>
/* ================= CURSORES ================= */

body{
margin:0;
font-family:"Inter", Arial, sans-serif;
color:#111;
background:#fff;
cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' shape-rendering='crispEdges'><polygon points='0,0 0,22 6,16 9,25 12,24 9,15 17,15' fill='%239CFF2E' stroke='black'/></svg>") 0 0, auto;
}

/* ================= UI ================= */

::selection{background:#9CFF2E;color:#000;}

::-webkit-scrollbar{width:14px;}
::-webkit-scrollbar-track{background:#f0f0f0;}
::-webkit-scrollbar-thumb{background:#9CFF2E;border:2px solid #000;}
::-webkit-scrollbar-thumb:hover{background:#7dff00;}

.nav{
position:fixed;top:0;left:0;width:100%;
background:#fff;border-bottom:1px solid #e5e5e5;z-index:1000;
}
.nav-inner{
max-width:1200px;margin:auto;padding:18px 24px;
display:flex;justify-content:center;gap:14px;
}
.nav-inner a{
text-decoration:none;color:#111;font-size:12px;
letter-spacing:1.6px;text-transform:uppercase;
padding:6px 12px;border:1px solid #9CFF2E;
}

header{
max-width:1200px;margin:auto;
padding:110px 24px 24px;text-align:center;
border-bottom:1px solid #e5e5e5;
}

.title{
font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
margin:0;
font-size:34px;
display:inline-block;
position:relative;
}
.title::after{
content:"";
display:block;
width:60%;
height:2px;
background:#9CFF2E;
margin:8px auto 0;
}

.subtitle{
margin-top:12px;
color:#555;
font-size:17px;
letter-spacing:.3px;
}

.seo-text{
max-width:720px;
margin:28px auto 0;
color:#444;
font-size:14px;
line-height:1.7;
}

/* HERO DESTACADOS */

.hero{
  max-width:1200px;
  margin:36px auto 0;
  padding:0 24px;

  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:24px;
}

.hero-item{
  width:100%;
}

.hero-item img,
.hero-item video{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}

@media (max-width:900px){
  .hero{
    grid-template-columns:1fr;
  }
}

/* GRID */

.grid{
max-width:1200px;
margin:40px auto 80px;
padding:0 24px;
columns:clamp(260px,28vw,340px);
column-gap:24px;
}
@media (max-width:700px){

  .grid{
    padding:0 24px;     /* mismo margen que header/hero */
    margin:40px auto 80px;
    columns:1;          /* una sola columna */
  }

  .item{
    width:100%;
    margin-left:auto;
    margin-right:auto;
  }

}
.item{
break-inside:avoid;
margin-bottom:26px;
display:inline-block;
width:100%;
background:#efefef;
padding:10px;
}

.item-media{
position:relative;
overflow:hidden;
background:#fff;
border:2px solid #cfcfcf;
box-shadow:3px 3px 0 #000;
}

.item:hover .item-media{
border-color:#9CFF2E;
}

.item-media img,
.item-media video{
width:100%;
height:auto;
display:block;
object-fit:contain;
background:transparent;
}

.item-media::after{
content:"";
position:absolute;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.05) 0px,
rgba(255,255,255,.05) 1px,
transparent 1px,
transparent 2px
);
mix-blend-mode:overlay;
opacity:0;
transition:opacity .25s;
pointer-events:none;
}

.item-overlay{
position:absolute;
inset:0;
display:flex;
align-items:flex-end;
padding:14px;
background:linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
opacity:0;
transition:opacity .35s ease;
}

.window-bar{
position:absolute;
top:8px;
left:8px;
height:18px;
background:#cfcfcf;
border:1px solid #000;
display:flex;
align-items:center;
padding:0 6px;
font-size:10px;
color:#000;
letter-spacing:.5px;
}
.window-dots{
display:flex;
gap:3px;
margin-right:6px;
}
.window-dots span{
width:8px;
height:8px;
background:#9CFF2E;
border:1px solid #000;
display:block;
}

.item-overlay span{
color:#9CFF2E;
font-size:18px;
font-weight:700;
transform:translateY(10px);
transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.item:hover .item-media img,
.item:hover .item-media video{transform:scale(1.06) translateY(-4px);}
.item:hover .item-overlay{opacity:1;}
.item:hover .item-overlay span{transform:translateY(0);}
.item:hover .item-media::after{opacity:.6;}

.project-caption{margin-top:8px;}
.project-caption h3{font-size:12.5px;margin:0 0 2px;}
.project-caption p{font-size:12px;color:#777;margin:0;}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:2000;
overflow:auto;
}

.modal-content{
max-width:900px;
margin:80px auto;
background:#cfcfcf;
border:2px solid #000;
box-shadow:6px 6px 0 #000;
}

.modal-header{
height:26px;
background:#9CFF2E;
border-bottom:2px solid #000;
display:flex;
align-items:center;
padding:0 8px;
font-size:12px;
font-weight:700;
color:#000;
}

.modal-body{
padding:18px;
background:#111;
color:#fff;
}

.modal-body img{
width:100%;
height:auto;
display:block;
margin-bottom:30px;
}

.modal-body video,
.modal-body iframe{
width:100%;
aspect-ratio:16/9;
height:auto;
display:block;
margin-bottom:30px;
}

.close{
position:fixed;
top:20px;
right:30px;
color:white;
font-size:40px;
cursor:pointer;
}

footer{
border-top:1px solid #e5e5e5;
padding:30px 24px;
text-align:center;
color:#666;
font-size:13px;
}

@media (max-width:700px){
.hero-item{
width:100%;
max-width:500px;
}
}
</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="index-en.html">Selected work</a>
<a href="about-en.html">About</a>
<a href="contact-en.html">Contact</a>
</div>
</nav>

<header>
<h1 class="title">Cintia Bonino</h1>
<p class="subtitle">Editorial illustrator in Barcelona</p>

<p style="margin-top:10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;">
<a href="index.html" style="color:#777;text-decoration:none;">ES</a> |
<a href="index-en.html" style="color:#111;text-decoration:none;">EN</a>
</p>

<p class="seo-text">
I am an editorial illustrator and animator based in Barcelona, specialising in press illustration, cultural posters, visual campaigns and 2D animation.
</p>
</header>

<div class="grid" id="grid"></div>

<footer>© Cintia Bonino — Illustrator in Barcelona</footer>

<script>

const projects=[

{title:"Soporte",description:"Conceptual 2D animation about the need for support from one's environment.",cover:"soporte.mp4",images:["soporte.mp4"]},

{title:"Vértigo",description:"Editorial illustration for an autofiction and contemporary narrative novel.",cover:"VERTIGO TAPA.png",images:["VERTIGO MOCK TAPA.png","VERTIGO GUARDA.png","VERTIGO MOCK INTERIOR.png"]},

{title:"True",description:"Conceptual 2D animation about escaping from one's own truth.",cover:"true.mp4",images:["true.mp4"]},

{title:"Does anyone really know you?",description:"Conceptual editorial illustration about identity and social perception.",cover:"ho know you photo.png",images:["ho know you photo.png","ho know you photo mock.png"]},

{title:"Should you just give up?",description:"Conceptual editorial illustration about failure and self-pressure.",cover:"NEW YORKER PESO photo.png",images:["NEW YORKER PESO photo.png","new yorker peso mock.png"]},

{title:"What animals understand about death?",description:"Editorial illustration for an article about animal consciousness and death.",cover:"rata photo.png",images:["rata photo.png","rata new yorker.png"]},

{title:"Café para uno",description:"Editorial illustration about urban solitude and everyday life.",cover:"cafe para uno.png",images:["cafe para uno mock.png"]},

{title:"Cartel Fiesta Mayor del Raval",description:"Cultural poster for the Festa Major del Raval in Barcelona.",cover:"CARTELL FESTA MAJOR DEL RAVAL 2025.png",images:[
"CARTELL FESTA MAJOR DEL RAVAL 2025.png",
"CARTELL FESTA MAJOR RAVAL MOCK.png",
"CARTELL RAVAL CALLE.jpeg",
"CARTELL RAVAL MERCH.jpeg",
"CARTELL RAVALL ALFOMBRA.jpeg"
]},

{title:"Los mundos de Anna",description:"Illustration for a youth illustrated book about the poet Anna María Martínez Sagi.",cover:"anna.png",images:["libro anna.png","ANNA MOCK INTERN.png"]},

{title:"La realidad es un videojuego",description:"Conceptual 2D animation about the perception of reality.",cover:"videojuego.mp4",images:["videojuego.mp4"]},

{title:"Mudanza",description:"2D animation about life change and personal transition.",cover:"mudanza.mp4",images:["mudanza.mp4"]},

{title:"Ideas",description:"Conceptual 2D animation about the creative process and thinking.",cover:"IDEAS.mp4",images:["IDEAS.mp4"]},

{title:"Amanecen Ocasos",description:"Animated videoclip for an experimental music project.",cover:"AMANECEN OCASOS.mp4",images:[
{type:"vimeo",id:"1158888775"}
]},

{title:"Breve historia de una colonización",description:"Conceptual animated videoclip about colonisation and historical memory.",cover:"RECORTE BREVE HISTORIA.mp4",images:[
{type:"vimeo",id:"1161767177"}
]},

{title:"María Antonieta (Converse)",description:"Conceptual graphic campaign for a fashion brand.",cover:"converse zapatillas.png",images:[
"converse total.png",
"converse mock caja total.png",
"converse mock caja zapatillas.png",
"converse tote toal.png",
"converse zapatillas.png",
"converse tote zapatillas.png"
]},

{title:"El cambio es movimiento (Adidas Pride)",description:"Visual campaign for Adidas Pride about diversity.",cover:"ADIDAS PRIDE SENORA.png",images:[
"ADIDAS PRIDE FINAL.png",
"ADIDAS PRIDE PERSONAJES.png",
"ADIDAS PRIDE ABSTRACCION.png",
"ADIDAS PRIDE ABSTRACCION MOCK.png"
]},

{title:"Cities (Coca-Cola)",description:"Graphic campaign about urban identity.",cover:"coca chicas sin fondo ph.png",images:[
"coca chicas sin fondo ph.png",
"coca barcelona ph.png",
"coca bs as ph.png",
"coca cola mock libreta bcn.png"
]}

];

function createGrid(){
  const grid=document.getElementById("grid");
  projects.forEach((p,i)=>{

    const item=document.createElement("div");
    item.className="item";
    item.onclick=()=>openProject(i);

    const mediaWrap=document.createElement("div");
    mediaWrap.className="item-media";

    let media;
    if(p.cover.endsWith(".mp4")){
      media=document.createElement("video");
      media.src=p.cover;
      media.autoplay=true;
      media.muted=true;
      media.loop=true;
      media.playsInline=true;
    }else{
      media=document.createElement("img");
      media.src=p.cover;
    }

    mediaWrap.appendChild(media);

    const overlay=document.createElement("div");
    overlay.className="item-overlay";
    overlay.innerHTML=`
    <div class="window-bar">
      <div class="window-dots">
        <span></span><span></span><span></span>
      </div>
      ${p.title}.exe
    </div>
    <span>${p.title}</span>
    `;

    mediaWrap.appendChild(overlay);
    item.appendChild(mediaWrap);

    const caption=document.createElement("div");
    caption.className="project-caption";
    caption.innerHTML=`<h3>${p.title}</h3><p>${p.description}</p>`;
    item.appendChild(caption);

    grid.appendChild(item);
  });
}

function openProject(i){
const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const p=projects[i];

content.innerHTML=`
<div class="modal-header">${p.title}.viewer</div>
<div class="modal-body">
<h2>${p.title}</h2>
<p>${p.description}</p>
</div>
`;

const body=content.querySelector(".modal-body");

p.images.forEach(src=>{
if(typeof src==="object"){
const iframe=document.createElement("iframe");
iframe.src=`https://player.vimeo.com/video/${src.id}`;
body.appendChild(iframe);
}else if(src.endsWith(".mp4")){
const video=document.createElement("video");
video.src=src;
video.controls=true;
video.style.width="100%";
video.style.height="auto";
body.appendChild(video);
}else{
const img=document.createElement("img");
img.src=src;
body.appendChild(img);
}
});

modal.style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

createGrid();
</script>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<div class="modal-content" id="modal-content"></div>
</div>

</body>
</html>
