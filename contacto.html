<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Cintia Bonino</title>

  <!-- SEO -->
  <meta name="description" content="Contacto de Cintia Bonino, ilustradora y animadora en Barcelona.">
  <link rel="canonical" href="https://cintiaboninoart.github.io/contacto.html">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
      line-height: 1.6;
    }

    /* MENÚ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      padding: 20px 24px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .nav-inner a {
      text-decoration: none;
      color: #111;
      font-size: 15px;
      font-weight: 500;
      padding-bottom: 4px;
    }

    .nav-inner a:hover {
      border-bottom: 2px solid #9CFF2E;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-top: 110px;
      padding: 0 24px;
    }

    header h1 {
      font-size: 32px;
      margin: 0;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 10px;
      color: #666;
      font-size: 15px;
    }

    /* CONTENIDO */
    section {
      max-width: 1100px;
      margin: auto;
      padding: 60px 24px 80px;
    }

    /* CONTACTO */
    .contact-container {
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    .contact-container h2 {
      font-size: 28px;
      margin-bottom: 30px;
      border-bottom: 4px solid #9CFF2E;
      display: inline-block;
      padding-bottom: 6px;
    }

    .contact-container p {
      margin-bottom: 40px;
    }

    .contact-container a {
      color: #111;
    }

    form {
      width: 100%;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      padding: 12px 30px;
      background: #9CFF2E;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .nav-inner {
        gap: 16px;
      }

      header {
        margin-top: 100px;
      }

      section {
        padding: 40px 20px 60px;
      }
    }
  </style>
</head>

<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html">Selección</a>
    <a href="sobre.html">Sobre mí</a>
    <a href="contacto.html">Contacto</a>
  </div>
</nav>

<header>
  <h1>Cintia Bonino — Contacto</h1>
  <p class="subtitle">Ilustración editorial · Animación · Dirección de arte</p>
</header>

<section>
  <div class="contact-container">
    <h2>¿Hablamos?</h2>

    <p>
      Instagram:
      <a href="https://instagram.com/cinbonino" target="_blank">@cinbonino</a>
    </p>

    <form action="https://formspree.io/f/mgoovwjg" method="POST">
      <input type="text" name="name" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Mensaje" rows="5" required></textarea>
      <button type="submit">Enviar mensaje</button>
    </form>
  </div>
</section>

</body>
</html>
