<!DOCTYPE html>

<title>Cintia Bonino — Animación y proyectos premiados</title>
<meta name="description" content="Portfolio de Cintia Bonino. Ilustración, animación y proyectos culturales premiados.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial, Helvetica, sans-serif;background:#fff;color:#111;}

.nav{position:fixed;top:0;left:0;width:100%;background:#fff;border-bottom:1px solid #ddd;z-index:1000;}
.nav-inner{max-width:1100px;margin:auto;padding:20px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;}
.nav-inner a{text-decoration:none;color:#111;font-size:15px;}

header{max-width:1100px;margin:auto;padding:120px 24px 40px;text-align:center;border-bottom:1px solid #ddd;}
header h1{font-size:36px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:900;}
header p{font-size:16px;margin-top:12px;color:#666;}

section{max-width:1100px;margin:auto;padding:40px 24px 80px;}

/* MASONRY PROPORCIONAL */

.grid{
column-count:3;
column-gap:24px;
}

.item{
position:relative;
margin-bottom:24px;
break-inside:avoid;
cursor:pointer;
transition:transform .25s ease, box-shadow .25s ease;
}

.item:hover{
transform:scale(1.01);
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.item img,
.item video{
width:100%;
height:auto;
display:block;
}

/* horizontales más grandes sin romper masonry */
.item.wide{
transform:scale(1.05);
}


/* overlay */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:opacity .3s ease;
pointer-events:none;
}

.overlay span{
color:#fff;
font-size:18px;
text-align:center;
padding:20px;
}

.item:hover .overlay{opacity:1;}

/* modal */

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;overflow-y:auto;}
.modal-content{max-width:900px;margin:80px auto;padding:20px;color:white;}
.modal-content img,
.modal-content video,
.modal-content iframe{width:100%;margin-bottom:30px;}
.modal-content iframe{aspect-ratio:16/9;height:auto;}

.project-title{text-align:center;font-size:28px;margin-bottom:12px;}
.project-description{max-width:700px;margin:0 auto 50px;text-align:center;line-height:1.7;}

.close{position:fixed;top:20px;right:30px;color:white;font-size:40px;cursor:pointer;}

@media(max-width:768px){
header{padding-top:170px;}
.grid{grid-template-columns:1fr;}
.item.wide{grid-column:span 1;}
.overlay{position:static;background:none;opacity:1;}
.modal-content{margin:70px auto 50px;padding:16px;}
.project-title{font-size:22px;}
.project-description{font-size:14px;}
}
</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="index.html">Selección</a>
<a href="about.html">Sobre mí</a>
<a href="contact.html">Contacto</a>
</div>
</nav>

function createGrid(){
const grid=document.getElementById("grid");
grid.innerHTML="";

projects.forEach((project,index)=>{
const item=document.createElement("div");
item.className="item";
if(project.wide) item.classList.add("wide");

item.onclick=()=>openProject(index);

let media;

if(project.cover.endsWith(".mp4")){
media=document.createElement("video");
media.src=project.cover;
media.autoplay=true;
media.loop=true;
media.muted=true;
media.playsInline=true;
media.preload="auto";
}else{
media=document.createElement("img");
media.src=project.cover;
}

item.appendChild(media);

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);

media.addEventListener("loadedmetadata",resizeGridItems);
media.addEventListener("load",resizeGridItems);
});
}

function resizeGridItems(){
const grid=document.querySelector(".grid");
const rowHeight=parseInt(window.getComputedStyle(grid).getPropertyValue("grid-auto-rows"));
const gap=parseInt(window.getComputedStyle(grid).getPropertyValue("gap"));

document.querySelectorAll(".item").forEach(item=>{
const media=item.querySelector("img, video");
if(!media) return;

const height=media.getBoundingClientRect().height;
const span=Math.ceil((height+gap)/(rowHeight+gap));
item.style.gridRowEnd="span "+span;
});
}

function openProject(index){

const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const project=projects[index];

content.innerHTML=`
<h2 class="project-title">${project.title}</h2>
<p class="project-description">${project.description}</p>
`;

project.images.forEach(src=>{

if(typeof src==="object" && src.type==="vimeo"){
const iframe=document.createElement("iframe");
iframe.src=`https://player.vimeo.com/video/${src.id}?autoplay=1&loop=1&muted=1`;
iframe.frameBorder="0";
iframe.allow="autoplay; fullscreen";
iframe.allowFullscreen=true;
content.appendChild(iframe);
return;
}

if(src.endsWith(".mp4")||src.endsWith(".mov")){
const video=document.createElement("video");
video.src=src;
video.autoplay=true;
video.loop=true;
video.muted=true;
video.playsInline=true;
video.controls=true;
video.preload="auto";
content.appendChild(video);
}else{
const img=document.createElement("img");
img.src=src;
img.loading="lazy";
content.appendChild(img);
}

});

modal.style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

window.addEventListener("load",createGrid);
window.addEventListener("resize",resizeGridItems);
