<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cintia Bonino — Animación y proyectos premiados</title>
  <meta name="description" content="Portfolio de Cintia Bonino. Ilustración, animación y proyectos culturales premiados.">
  <meta name="keywords" content="ilustración, animación, dirección de arte, portfolio, Cintia Bonino">
  <meta name="author" content="Cintia Bonino">

  <meta property="og:title" content="Cintia Bonino — Animación y proyectos premiados">
  <meta property="og:description" content="Portfolio de ilustración, animación y proyectos culturales.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cintiaboninoart.github.io">
  <meta property="og:image" content="https://cintiaboninoart.github.io/preview.jpg">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#ffffff;
color:#111;
}

/* NAV */

.nav{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
border-bottom:1px solid #ddd;
z-index:1000;
}

.nav-inner{
max-width:1100px;
margin:auto;
padding:20px;
display:flex;
justify-content:center;
gap:28px;
flex-wrap:wrap;
}

.nav-inner a{
text-decoration:none;
color:#111;
font-size:15px;
}

/* HEADER */

header{
max-width:1100px;
margin:auto;
padding:120px 24px 40px;
text-align:center;
border-bottom:1px solid #ddd;
}

header h1{
font-size:36px;
margin:0;
letter-spacing:2px;
text-transform:uppercase;
font-weight:900;
}

header p{
font-size:16px;
margin-top:12px;
color:#666;
}

/* SECTION */

section{
max-width:1100px;
margin:auto;
padding:40px 24px 80px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
grid-auto-flow:dense;
}

.item{
position:relative;
cursor:pointer;
overflow:hidden;
line-height:0;
transition:box-shadow .25s ease, transform .25s ease;
}

.item:hover{
transform:scale(1.01);
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.item video,
.item img{
width:100%;
height:100%;
display:block;
object-fit:cover;
}

.item.wide{
grid-column:1 / span 2;
}

/* OVERLAY */

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:opacity .3s ease;
pointer-events:none;
}

.overlay span{
color:#fff;
font-size:18px;
text-align:center;
padding:20px;
}

.item:hover .overlay{
opacity:1;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:2000;
overflow-y:auto;
}

.modal-content{
max-width:900px;
margin:80px auto;
padding:20px;
color:white;
}

.modal-content img,
.modal-content video,
.modal-content iframe{
width:100%;
margin-bottom:30px;
}

.modal-content iframe{
aspect-ratio:16 / 9;
height:auto;
}

.project-title{
text-align:center;
font-size:28px;
margin-bottom:12px;
}

.project-description{
max-width:700px;
margin:0 auto 50px;
text-align:center;
line-height:1.7;
}

.close{
position:fixed;
top:20px;
right:30px;
color:white;
font-size:40px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

header{padding-top:170px;}

.grid{
grid-template-columns:1fr;
}

.item.wide{
grid-column:span 1;
}

.overlay{
position:static;
background:none;
opacity:1;
}

.modal-content{
margin:70px auto 50px;
padding:16px;
}

.project-title{font-size:22px;}
.project-description{font-size:14px;}

}

</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="index.html">Selección</a>
<a href="about.html">Sobre mí</a>
<a href="contact.html">Contacto</a>
</div>
</nav>

<header>
<h1>Cintia Bonino</h1>
<p>Animación y proyectos premiados</p>
</header>

<section>
<div class="grid" id="grid"></div>
</section>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<div class="modal-content" id="modal-content"></div>
</div>

<script>

const projects=[

{
title:"Amanecen Ocasos",
description:"Videoclip animado.",
cover:"AMANECEN OCASOS.mp4",
images:[{type:"vimeo",id:"1158888775"}],
wide:true
},

{
title:"Breve historia de una colonización",
description:"Videoclip animado.",
cover:"RECORTE BREVE HISTORIA.mp4",
images:[{type:"vimeo",id:"1161767177"}],
wide:true
},

{
title:"Cartel Fiesta Mayor del Raval",
description:"Proyecto ganador concurso público Barcelona.",
cover:"CARTELL FESTA MAJOR DEL RAVAL 2025.png",
images:[
"CARTELL FESTA MAJOR DEL RAVAL 2025.png",
"CARTELL FESTA MAJOR RAVAL MOCK.png",
"CARTELL RAVAL CALLE.jpeg",
"CARTELL RAVAL MERCH.jpeg",
"CARTELL RAVALL ALFOMBRA.jpeg"
],
wide:true
},

{
title:"Soporte",
description:"Animación.",
cover:"soporte.mp4",
images:["soporte.mp4"]
},

{
title:"Ideas",
description:"Animación.",
cover:"IDEAS.mp4",
images:["IDEAS.mp4"]
},

{
title:"Mudanza",
description:"Animación.",
cover:"mudanza.mp4",
images:["mudanza.mp4"]
},

{
title:"La realidad es un videojuego",
description:"Animación.",
cover:"videojuego.mp4",
images:["videojuego.mp4"]
},

{
title:"Cities",
description:"Campaña conceptual Coca-Cola.",
cover:"coca chicas sin fondo ph.png",
images:[
"coca chicas sin fondo ph.png",
"coca barcelona ph.png",
"coca bs as ph.png",
"coca cola mock libreta bcn.png"
]
},

{
title:"El cambio es movimiento",
description:"Campaña conceptual Adidas Pride.",
cover:"ADIDAS PRIDE SENORA.png",
images:[
"ADIDAS PRIDE FINAL.png",
"ADIDAS PRIDE PERSONAJES.png",
"ADIDAS PRIDE ABSTRACCION.png",
"ADIDAS PRIDE ABSTRACCION MOCK.png"
]
},

{
title:"María Antonieta",
description:"Campaña conceptual Converse.",
cover:"converse total.png",
images:[
"converse total.png",
"converse mock caja total.png",
"converse mock caja zapatillas.png",
"converse tote toal.png",
"converse zapatillas.png",
"converse tote zapatillas.png"
]
},

{
title:"Should you just give up?",
description:"Ilustración editorial.",
cover:"NEW YORKER PESO photo.png",
images:[
"NEW YORKER PESO photo.png",
"new yorker peso mock.png"
]
},

{
title:"Café para uno",
description:"Ilustración editorial.",
cover:"cafe para uno.png",
images:[
"cafe para uno mock.png"
]
},

{
title:"Does anyone really know you?",
description:"Ilustración editorial.",
cover:"ho know you photo.png",
images:[
"ho know you photo.png",
"ho know you photo mock.png"
]
},

{
title:"What animals understand about death?",
description:"Ilustración editorial.",
cover:"rata photo.png",
images:[

"rata new yorker.png"
]

{
title:"Lunática",
description:"Libro ilustrado.",
cover:"1.png",
images:[
"1.png",
"luna llena mock.png",
"desayuno mock.png"
]
},

{
title:"Vértigo",
description:"Diseño e ilustración editorial.",
cover:"VERTIGO TAPA.png",
images:[
"VERTIGO MOCK TAPA.png",
"VERTIGO GUARDA.png",
"VERTIGO MOCK INTERIOR.png"
],
},

{
title:"Los mundos de Anna",
description:"Libro ilustrado.",
cover:"anna.png",
images:[
"libro anna.png",
"ANNA MOCK INTERN.png"
],
wide:true
}

];

function createGrid(){
const grid=document.getElementById("grid");
grid.innerHTML="";

projects.forEach((project,index)=>{

const item=document.createElement("div");
item.className="item";
if(project.wide) item.classList.add("wide");

item.onclick=()=>openProject(index);

if(project.cover.endsWith(".mp4")){
const video=document.createElement("video");
video.src=project.cover;
video.autoplay=true;
video.loop=true;
video.muted=true;
video.playsInline=true;
video.preload="auto";
item.appendChild(video);
}else{
const img=document.createElement("img");
img.src=project.cover;
item.appendChild(img);
}

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);

});
}

function openProject(index){

const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const project=projects[index];

content.innerHTML=`
<h2 class="project-title">${project.title}</h2>
<p class="project-description">${project.description}</p>
`;

project.images.forEach(src=>{

if(typeof src==="object" && src.type==="vimeo"){
const iframe=document.createElement("iframe");
iframe.src=`https://player.vimeo.com/video/${src.id}?autoplay=1&loop=1&muted=1`;
iframe.frameBorder="0";
iframe.allow="autoplay; fullscreen";
iframe.allowFullscreen=true;
content.appendChild(iframe);
return;
}

if(src.endsWith(".mp4")||src.endsWith(".mov")){
const video=document.createElement("video");
video.src=src;
video.autoplay=true;
video.loop=true;
video.muted=true;
video.playsInline=true;
video.controls=true;
video.preload="auto";
content.appendChild(video);
}else{
const img=document.createElement("img");
img.src=src;
img.loading="lazy";
content.appendChild(img);
}

});

modal.style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

window.addEventListener("load",createGrid);

</script>

</body>
</html>
