<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cintia Bonino — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#fff;
color:#111;
}

header{
max-width:1100px;
margin:auto;
padding:60px 24px 20px;
text-align:center;
border-bottom:1px solid #ddd;
}

header h1{
margin:0;
font-size:36px;
letter-spacing:2px;
text-transform:uppercase;
}

header p{
margin-top:10px;
color:#666;
}

/* GRID LIMPIO */
.grid{
max-width:1100px;
margin:40px auto 80px;
padding:0 24px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
align-items:start;
}

.item{
position:relative;
cursor:pointer;
}

/* imágenes SIEMPRE completas */
.item img,
.item video{
width:100%;
height:auto;
display:block;
object-fit:contain;
}

/* jerarquía */
.item.large{
grid-column:span 2;
}

/* overlay */
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:.3s;
}

.overlay span{
color:white;
font-size:18px;
}

.item:hover .overlay{
opacity:1;
}

@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:600px){
.grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
<h1>Cintia Bonino</h1>
<p>Ilustradora y animadora</p>
</header>

<div class="grid" id="grid"></div>

<script>
const projects=[
{title:"Vértigo",cover:"VERTIGO TAPA.png"},
{title:"Does anyone really know you?",cover:"ho know you photo.png"},
{title:"Amanecen Ocasos",cover:"AMANECEN OCASOS.mp4"},
{title:"Café para uno",cover:"cafe para uno.png"},
{title:"Breve historia de una colonización",cover:"RECORTE BREVE HISTORIA.mp4"},
{title:"Cartel Fiesta Mayor del Raval",cover:"CARTELL FESTA MAJOR DEL RAVAL 2025.png"},
{title:"Los mundos de Anna",cover:"anna.png"},
{title:"Should you just give up?",cover:"NEW YORKER PESO photo.png"},
{title:"What animals understand about death?",cover:"rata photo.png"},
{title:"María Antonieta",cover:"converse total.png"},
{title:"El cambio es movimiento",cover:"ADIDAS PRIDE SENORA.png"},
{title:"Cities",cover:"coca chicas sin fondo ph.png"},
{title:"La realidad es un videojuego",cover:"videojuego.mp4"},
{title:"Mudanza",cover:"mudanza.mp4"},
{title:"Soporte",cover:"soporte.mp4"},
{title:"Ideas",cover:"IDEAS.mp4"}
];

function createGrid(){
const grid=document.getElementById("grid");

projects.forEach(project=>{
const item=document.createElement("div");
item.className="item";

/* grandes */
if(project.title==="Amanecen Ocasos" || project.title==="Breve historia de una colonización"){
item.classList.add("large");
}

let media;

if(project.cover.endsWith(".mp4")){
media=document.createElement("video");
media.src=project.cover;
media.autoplay=true;
media.loop=true;
media.muted=true;
media.playsInline=true;
}else{
media=document.createElement("img");
media.src=project.cover;
media.alt=project.title;
}

item.appendChild(media);

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);
});
}

window.addEventListener("load",createGrid);
</script>

</body>
</html>
