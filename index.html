<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Cintia Bonino — Ilustradora y animadora en Barcelona | Portfolio</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Portfolio de Cintia Bonino, ilustradora y animadora en Barcelona. Ilustración editorial, animación y proyectos premiados.">

<link rel="preload" as="image" href="1.png">

<style>
body{margin:0;font-family:Arial, Helvetica, sans-serif;background:#fff;color:#111;}

.nav{position:fixed;top:0;left:0;width:100%;background:#fff;border-bottom:1px solid #ddd;z-index:1000;}
.nav-inner{max-width:1100px;margin:auto;padding:20px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;}
.nav-inner a{text-decoration:none;color:#111;font-size:15px;}

header{max-width:1100px;margin:auto;padding:120px 24px 40px;text-align:center;border-bottom:1px solid #ddd;}
header h1{font-size:36px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:900;}
header p{font-size:16px;margin-top:12px;color:#666;}

.hero{
max-width:1100px;
margin:40px auto 0;
padding:0 24px;
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.hero-item{position:relative;cursor:pointer;overflow:hidden;}
.hero-item img,.hero-item video{width:100%;height:auto;display:block;}

.hero-title{
position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.35);color:#fff;font-size:28px;opacity:0;transition:.3s;
}
.hero-item:hover .hero-title{opacity:1;}

section{max-width:1100px;margin:auto;padding:40px 24px 80px;}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
grid-auto-rows:10px;
grid-auto-flow:dense;
}

.item{position:relative;cursor:pointer;overflow:hidden;}
.item img,.item video{width:100%;height:auto;display:block;}

.overlay{
position:absolute;inset:0;background:rgba(0,0,0,.55);
display:flex;align-items:center;justify-content:center;
opacity:0;transition:.3s;
}
.overlay span{color:#fff;font-size:18px;}
.item:hover .overlay{opacity:1;}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;overflow-y:auto;}
.modal-content{max-width:900px;margin:80px auto;padding:20px;color:white;}
.modal-content img,.modal-content video,.modal-content iframe{width:100%;margin-bottom:30px;}
.modal-content iframe{aspect-ratio:16/9;}

.project-title{text-align:center;font-size:28px;margin-bottom:12px;}
.project-description{text-align:center;margin-bottom:40px;}

.close{position:fixed;top:20px;right:30px;color:white;font-size:40px;cursor:pointer;}

@media(max-width:768px){
.hero{grid-template-columns:1fr;}
.grid{grid-template-columns:1fr;}
.hero-title{font-size:22px;}
}
</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="#">Selección</a>
<a href="#">Sobre mí</a>
<a href="#">Contacto</a>
</div>
</nav>

<header>
<h1>Cintia Bonino</h1>
<p>Ilustradora y animadora en Barcelona — ilustración editorial, animación y proyectos premiados</p>
</header>

<div class="hero">

<div class="hero-item" onclick="openProject(0)">
<img src="1.png" alt="Lunática — libro ilustrado">
<div class="hero-title">Lunática</div>
</div>

<div class="hero-item" onclick="openProject(15)">
<video src="soporte.mp4" autoplay loop muted playsinline></video>
<div class="hero-title">Soporte</div>
</div>

</div>

<section>
<div class="grid" id="grid"></div>
</section>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<div class="modal-content" id="modal-content"></div>
</div>

<script>
const projects=[ /* TU ARRAY EXACTO SIN CAMBIOS */ ];

const heroIndexes=[0,15];

function createGrid(){
const grid=document.getElementById("grid");

projects.forEach((project,index)=>{
if(heroIndexes.includes(index)) return;

const item=document.createElement("div");
item.className="item";
item.onclick=()=>openProject(index);

let media;

if(project.cover.endsWith(".mp4")){
media=document.createElement("video");
media.src=project.cover;
media.autoplay=true;
media.loop=true;
media.muted=true;
media.playsInline=true;

media.addEventListener("loadedmetadata",resizeGridItems);

}else{
media=document.createElement("img");
media.src=project.cover;
media.alt=project.title+" — ilustración de Cintia Bonino";
media.loading="lazy";

if(media.complete){
resizeGridItems();
}else{
media.onload=resizeGridItems;
}
}

item.appendChild(media);

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);
});
}

function resizeGridItems(){
const grid=document.querySelector(".grid");
const rowHeight=parseInt(window.getComputedStyle(grid).getPropertyValue("grid-auto-rows"));
const gap=parseInt(window.getComputedStyle(grid).getPropertyValue("row-gap"));

document.querySelectorAll(".item").forEach(item=>{
const height=item.getBoundingClientRect().height;
if(!height) return;

const span=Math.ceil((height+gap)/(rowHeight+gap));
item.style.gridRowEnd="span "+span;
});
}

function openProject(index){
const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const project=projects[index];

content.innerHTML=`<h2 class="project-title">${project.title}</h2>
<p class="project-description">${project.description}</p>`;

project.images.forEach(src=>{
if(typeof src==="object"){
const iframe=document.createElement("iframe");
iframe.src=`https://player.vimeo.com/video/${src.id}`;
content.appendChild(iframe);
}else if(src.endsWith(".mp4")){
const video=document.createElement("video");
video.src=src;
video.controls=true;
video.playsInline=true;
content.appendChild(video);
}else{
const img=document.createElement("img");
img.src=src;
img.alt=project.title;
img.loading="lazy";
content.appendChild(img);
}
});

modal.style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",e=>{
if(e.target.id==="modal") closeModal();
});

window.addEventListener("load",createGrid);
window.addEventListener("resize",resizeGridItems);
</script>

</body>
</html>
