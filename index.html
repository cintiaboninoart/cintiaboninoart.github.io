<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cintia Bonino — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial, Helvetica, sans-serif;background:#fff;color:#111;}

.nav{position:fixed;top:0;left:0;width:100%;background:#fff;border-bottom:1px solid #ddd;z-index:1000;}
.nav-inner{max-width:1100px;margin:auto;padding:20px;display:flex;justify-content:center;gap:28px;}
.nav-inner a{text-decoration:none;color:#111;font-size:15px;}

header{max-width:1100px;margin:auto;padding:120px 24px 40px;text-align:center;border-bottom:1px solid #ddd;}
header h1{font-size:36px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:900;}
header p{font-size:16px;margin-top:12px;color:#666;}

.hero{max-width:1100px;margin:40px auto 0;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.hero-item{position:relative;cursor:pointer;overflow:hidden;}
.hero-item img,.hero-item video{width:100%;display:block;}

.hero-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:28px;opacity:0;transition:.3s;}
.hero-item:hover .hero-title{opacity:1;}

section{max-width:1100px;margin:auto;padding:40px 24px 80px;}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
align-items:start;
}

.item{
position:relative;
cursor:pointer;
overflow:hidden;
}

.item img,.item video{
width:100%;
display:block;
}

/* grandes */
.item.large{
grid-column:span 2;
}

/* verticales */
.item.tall img,
.item.tall video{
aspect-ratio:3/4;
object-fit:cover;
}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:.3s;}
.overlay span{color:#fff;font-size:18px;}
.item:hover .overlay{opacity:1;}

@media(max-width:768px){
.grid{grid-template-columns:1fr;}
.hero{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="#">Selección</a>
<a href="#">Sobre mí</a>
<a href="#">Contacto</a>
</div>
</nav>

<header>
<h1>Cintia Bonino</h1>
<p>Ilustradora y animadora en Barcelona — ilustración editorial y animación</p>
</header>

<section>
<div class="grid" id="grid"></div>
</section>

<script>
const projects=[
{title:"Vértigo",cover:"VERTIGO TAPA.png"},
{title:"Does anyone really know you?",cover:"ho know you photo.png"},
{title:"Amanecen Ocasos",cover:"AMANECEN OCASOS.mp4"},
{title:"Café para uno",cover:"cafe para uno.png"},
{title:"Breve historia de una colonización",cover:"RECORTE BREVE HISTORIA.mp4"},
{title:"Cartel Fiesta Mayor del Raval",cover:"CARTELL FESTA MAJOR DEL RAVAL 2025.png"},
{title:"Los mundos de Anna",cover:"anna.png"},
{title:"Should you just give up?",cover:"NEW YORKER PESO photo.png"},
{title:"What animals understand about death?",cover:"rata photo.png"},
{title:"María Antonieta",cover:"converse total.png"},
{title:"El cambio es movimiento",cover:"ADIDAS PRIDE SENORA.png"},
{title:"Cities",cover:"coca chicas sin fondo ph.png"},
{title:"La realidad es un videojuego",cover:"videojuego.mp4"},
{title:"Mudanza",cover:"mudanza.mp4"},
{title:"Soporte",cover:"soporte.mp4"},
{title:"Ideas",cover:"IDEAS.mp4"}
];

function createGrid(){
const grid=document.getElementById("grid");

projects.forEach(project=>{
const item=document.createElement("div");
item.className="item";

/* grandes */
if(project.title==="Amanecen Ocasos" || project.title==="Breve historia de una colonización"){
item.classList.add("large");
}

/* verticales */
if(project.title==="Café para uno" || project.title==="Does anyone really know you?"){
item.classList.add("tall");
}

let media;
if(project.cover.endsWith(".mp4")){
media=document.createElement("video");
media.src=project.cover;
media.autoplay=true;
media.loop=true;
media.muted=true;
media.playsInline=true;
}else{
media=document.createElement("img");
media.src=project.cover;
}

item.appendChild(media);

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);
});
}

window.addEventListener("load",createGrid);
</script>

</body>
</html>
