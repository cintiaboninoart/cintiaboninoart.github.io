<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cintia Bonino — Ilustración y animación</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
color:#111;
background:#fff;
}

/* NAV */
.nav{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
border-bottom:1px solid #ddd;
z-index:1000;
}
.nav-inner{
max-width:1100px;
margin:auto;
padding:18px 24px;
display:flex;
justify-content:center;
gap:28px;
}
.nav-inner a{
text-decoration:none;
color:#111;
font-size:14px;
}

/* HEADER */
header{
max-width:1100px;
margin:auto;
padding:110px 24px 30px;
text-align:center;
border-bottom:1px solid #ddd;
}
header h1{
margin:0;
font-size:34px;
letter-spacing:2px;
text-transform:uppercase;
}
header p{
margin-top:10px;
color:#666;
}

/* HERO */
.hero{
max-width:calc(3 * 280px + 2 * 20px);
margin:40px auto 0;
padding:0 24px;
display:grid;
grid-template-columns:1fr 1fr;
gap:32px;
align-items:stretch;
}
.hero-item{
position:relative;
cursor:pointer;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
}
.hero-item img,
.hero-item video{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

/* GRID */
.grid{
max-width:1100px;
margin:40px auto 80px;
padding:0 24px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,280px));
justify-content:center;
grid-auto-rows:10px;
gap:20px;
}

.item{
position:relative;
cursor:pointer;
overflow:hidden;
border-radius:2px;
}

/* ← horizontales */
.item.wide{
grid-column:span 2;
}

.item img,
.item video{
width:100%;
height:auto;
display:block;
}

/* OVERLAY */
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:.3s;
}
.overlay span{
color:white;
font-size:18px;
}
.item:hover .overlay{
opacity:1;
}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:2000;
overflow:auto;
}
.modal-content{
max-width:900px;
margin:80px auto;
padding:20px;
color:white;
}
.modal-content img,
.modal-content video,
.modal-content iframe{
width:100%;
margin-bottom:30px;
}
.modal-content iframe{
aspect-ratio:16/9;
border:0;
}
.project-title{
font-size:28px;
margin-bottom:10px;
text-align:center;
}
.project-description{
margin-bottom:30px;
text-align:center;
}
.close{
position:fixed;
top:20px;
right:30px;
color:white;
font-size:40px;
cursor:pointer;
}

@media(max-width:900px){
.hero{grid-template-columns:1fr;}
.item.wide{grid-column:span 1;} /* móvil */
}
</style>
</head>

<body>

<nav class="nav">
<div class="nav-inner">
<a href="#">Selección</a>
<a href="#">Sobre mí</a>
<a href="#">Contacto</a>
</div>
</nav>

<header>
<h1>Cintia Bonino</h1>
<p>Ilustradora y animadora en Barcelona</p>
</header>

<div class="hero">
<div class="hero-item" onclick="openProject(0)">
<img src="VERTIGO TAPA.png">
</div>

<div class="hero-item" onclick="openProject(9)">
<video src="soporte.mp4" autoplay muted loop playsinline></video>
</div>
</div>

<div class="grid" id="grid"></div>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<div class="modal-content" id="modal-content"></div>
</div>

<script>
const projects=[ /* TU ARRAY SIN CAMBIOS */ 
{title:"Vértigo",description:"Diseño e ilustración editorial.",cover:"VERTIGO TAPA.png",images:["VERTIGO MOCK TAPA.png","VERTIGO GUARDA.png","VERTIGO MOCK INTERIOR.png"]},
{title:"Does anyone really know you?",description:"Ilustración editorial.",cover:"ho know you photo.png",images:["ho know you photo.png","ho know you photo mock.png"]},
{title:"Café para uno",description:"Ilustración editorial.",cover:"cafe para uno.png",images:["cafe para uno mock.png"]},
{title:"Cartel Fiesta Mayor del Raval",description:"Proyecto ganador concurso público Barcelona.",cover:"CARTELL FESTA MAJOR DEL RAVAL 2025.png",images:["CARTELL FESTA MAJOR DEL RAVAL 2025.png","CARTELL FESTA MAJOR RAVAL MOCK.png","CARTELL RAVAL CALLE.jpeg","CARTELL RAVAL MERCH.jpeg","CARTELL RAVALL ALFOMBRA.jpeg"]},
{title:"Los mundos de Anna",description:"Libro ilustrado.",cover:"anna.png",images:["libro anna.png","ANNA MOCK INTERN.png"]},
{title:"Should you just give up?",description:"Ilustración editorial.",cover:"NEW YORKER PESO photo.png",images:["NEW YORKER PESO photo.png","new yorker peso mock.png"]},
{title:"What animals understand about death?",description:"Ilustración editorial.",cover:"rata photo.png",images:["rata photo.png","rata new yorker.png"]},
{title:"Amanecen Ocasos",description:"Videoclip animado.",cover:"AMANECEN OCASOS.mp4",images:[{type:"vimeo",id:"1158888775"}]},
{title:"Breve historia de una colonización",description:"Videoclip animado.",cover:"RECORTE BREVE HISTORIA.mp4",images:[{type:"vimeo",id:"1161767177"}]},
{title:"Soporte",description:"Animación.",cover:"soporte.mp4",images:["soporte.mp4"]},
{title:"La realidad es un videojuego",description:"Animación.",cover:"videojuego.mp4",images:["videojuego.mp4"]},
{title:"Mudanza",description:"Animación.",cover:"mudanza.mp4",images:["mudanza.mp4"]},
{title:"Ideas",description:"Animación.",cover:"IDEAS.mp4",images:["IDEAS.mp4"]},
{title:"María Antonieta",description:"Campaña conceptual Converse.",cover:"converse zapatillas.png",images:["converse total.png","converse mock caja total.png","converse mock caja zapatillas.png","converse tote toal.png","converse zapatillas.png","converse tote zapatillas.png"]},
{title:"El cambio es movimiento",description:"Campaña conceptual Adidas Pride.",cover:"ADIDAS PRIDE SENORA.png",images:["ADIDAS PRIDE FINAL.png","ADIDAS PRIDE PERSONAJES.png","ADIDAS PRIDE ABSTRACCION.png","ADIDAS PRIDE ABSTRACCION MOCK.png"]},
{title:"Cities",description:"Campaña conceptual Coca-Cola.",cover:"coca chicas sin fondo ph.png",images:["coca chicas sin fondo ph.png","coca barcelona ph.png","coca bs as ph.png","coca cola mock libreta bcn.png"]}
];

/* índices horizontales */
const wideProjects=[4,7,8];

function resizeGridItems(){
const grid=document.querySelector(".grid");
const rowHeight=parseInt(getComputedStyle(grid).getPropertyValue("grid-auto-rows"));
const gap=parseInt(getComputedStyle(grid).getPropertyValue("gap"));

grid.querySelectorAll(".item").forEach(item=>{
const media=item.querySelector("img,video");
if(!media) return;

const width=media.clientWidth;
let height;

if(media.tagName==="VIDEO" && media.videoWidth){
height=width*(media.videoHeight/media.videoWidth);
}else if(media.tagName==="IMG" && media.naturalWidth){
height=width*(media.naturalHeight/media.naturalWidth);
}else{
height=media.getBoundingClientRect().height;
}

const span=Math.ceil((height+gap)/(rowHeight+gap));
item.style.gridRowEnd="span "+span;
});
}

function createGrid(){
const grid=document.getElementById("grid");

/* horizontales */
const wide=[4,7,8];

/* separar */
const verticalProjects=[];
const horizontalProjects=[];

projects.forEach((p,i)=>{
if(i===0||i===9) return;

if(wide.includes(i)){
horizontalProjects.push({project:p,index:i});
}else{
verticalProjects.push({project:p,index:i});
}
});

/* ritmo: cada 4 verticales → 1 horizontal */
const sequence=[];
let v=0,h=0;

while(v<verticalProjects.length||h<horizontalProjects.length){

for(let i=0;i<4 && v<verticalProjects.length;i++){
sequence.push(verticalProjects[v++]);
}

if(h<horizontalProjects.length){
sequence.push(horizontalProjects[h++]);
}
}

/* crear DOM */
sequence.forEach(({project,index})=>{

const item=document.createElement("div");
item.className="item";
if(wide.includes(index)) item.classList.add("wide");

item.onclick=()=>openProject(index);

let media;

if(project.cover.endsWith(".mp4")){
media=document.createElement("video");
media.src=project.cover;
media.loop=true;
media.muted=true;
media.playsInline=true;
media.autoplay=true;
media.onloadeddata=resizeGridItems;
}else{
media=document.createElement("img");
media.src=project.cover;
media.onload=resizeGridItems;
}

item.appendChild(media);

const overlay=document.createElement("div");
overlay.className="overlay";
overlay.innerHTML=`<span>${project.title}</span>`;
item.appendChild(overlay);

grid.appendChild(item);

});

}

function openProject(index){
const modal=document.getElementById("modal");
const content=document.getElementById("modal-content");
const project=projects[index];

content.innerHTML=`<h2 class="project-title">${project.title}</h2>
<p class="project-description">${project.description}</p>`;

project.images.forEach(src=>{
if(typeof src==="object"){
const iframe=document.createElement("iframe");
iframe.src=`https://player.vimeo.com/video/${src.id}`;
content.appendChild(iframe);
}else if(src.endsWith(".mp4")){
const video=document.createElement("video");
video.src=src;
video.controls=true;
content.appendChild(video);
}else{
const img=document.createElement("img");
img.src=src;
content.appendChild(img);
}
});

modal.style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

window.addEventListener("load",()=>{
createGrid();
setTimeout(resizeGridItems,300);
});
window.addEventListener("resize",resizeGridItems);
</script>

</body>
</html>
